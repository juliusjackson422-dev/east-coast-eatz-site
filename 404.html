<style>
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem;
  background:
    radial-gradient(120% 90% at 50% 112%,rgba(34,114,236,.34),transparent 64%),
    #060a18;
  color:#f4f0e7;font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.6;text-align:center;
}
img{display:block;margin:0 auto 2rem;width:min(300px,72vw)}
h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;
   font-size:clamp(3rem,13vw,7rem);line-height:.88;margin:0 0 .35em;letter-spacing:.01em}
h1 span{color:#ffc02e}
p{max-width:46ch;margin:0 auto 1.1em;color:#9bacd2}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:2rem}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  font-family:Anton,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;
  padding:.92em 1.5em;border-radius:7px;border:2px solid transparent;
  transition:transform .3s cubic-bezier(.16,1,.3,1),background-color .3s,border-color .3s
}
.gold{background:#ffc02e;color:#17120a;box-shadow:0 8px 30px -10px rgba(255,192,46,.8)}
.ghost{border-color:rgba(140,175,255,.5);color:#f4f0e7;background:rgba(255,255,255,.04)}
a.btn:hover{transform:translateY(-3px)}
.ghost:hover{border-color:#4fb0ff;background:rgba(79,176,255,.12)}
:focus-visible{outline:3px solid #ffc02e;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>

<body>
<main>
  <img src="img/logo.webp" width="374" height="110" alt="East Coast Eatz">
  <h1>Wrong <span>window.</span></h1>
  <p>That page is not on the truck. The cheesesteaks still are.</p>
  <p>Call the truck on <strong style="color:#ffc02e">(513)&nbsp;739-7393</strong> — or head back and have a look at the menu.</p>
  <div class="cta">
    <!-- "./" not "/" — on a project Pages URL the site root is
         /east-coast-eatz-site/, not the domain root. "./" is correct both
         there and on eastcoasteatz.com once it moves. -->
    <a class="btn gold" href="./">Back to the site</a>
    <a class="btn ghost" href="tel:+15137397393">Call 513&middot;739&middot;7393</a>
  </div>
</main>
